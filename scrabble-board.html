<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Board</title>
</head>
<style>
     /* This CSS styling is to make a boar of 15x15 size with squares of 40 pixels by 40 pixels */
    
    .board {
        display: grid;
        grid-template-rows: (15, 40px);
        grid-template-columns: (15, 40px);
        gap: 3px;
        background-color: cyan;
        padding: 8px;
    }

    /* This CSS styling is for each individual square */

    .sq {
        width: 40px;
        height: 40px;
        background-color: blanchedalmond;
        border-radius: 3px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 12px;
        font-weight: bold;
    }
</style>

</html>
